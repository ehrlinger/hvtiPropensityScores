# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: lint

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # local::. installs the package itself, not just its dependencies.
          # Without it object_usage_linter cannot resolve the package's own
          # internal functions and reports every call to one as an undefined
          # global -- 58 phantom lints here, more than the real total.
          # lintr is version-pinned: a release can add checks to an existing
          # linter and redden a green build with no change to the code.
          extra-packages: any::lintr@3.4.0, local::.

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
