# Fails the build when .claude/house-style.md drifts from the vault sources
# it was composed from. The artifact is generated; a hand edit or a stale
# copy is the failure this check exists to make loud.

name: house-style

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  house-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This job executes a script checked out from another repository.
          # Not persisting the token keeps it out of .git/config for every
          # step that follows, so a later `git` call cannot reach the remote
          # with this repo's credentials.
          persist-credentials: false

      - name: Check out the house style composer
        uses: actions/checkout@v4
        with:
          repository: ehrlinger/house-style
          # Pinned to a tag, not the default branch: an in-progress change to
          # the composer must not redden this repo's CI. The tag moves when the
          # standard changes, which is exactly when every repo should start
          # reporting drift until it recomposes.
          ref: house-style-v1
          path: .house-style-tools
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Only the composer's two dependencies. This job never builds the
      # package, so resolving the full DESCRIPTION tree would cost minutes
      # to install code nothing here calls.
      - name: Install composer dependencies
        run: install.packages(c("yaml", "digest"))
        shell: Rscript {0}

      - name: Point the registry at this checkout
        run: |
          # repos.yml carries workstation paths; CI must repoint this repo's
          # entry at the runner checkout. Match by repo name rather than by a
          # specific workstation path so registry path renames upstream do not
          # break this job before the composer ever runs.
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path(".house-style-tools/repos.yml")
          lines = path.read_text().splitlines()

          index = [i for i, line in enumerate(lines) if line == "  - name: hvtiRpropensity"]
          if len(index) != 1:
              raise SystemExit(
                  "repos.yml must contain exactly one repo entry named 'hvtiRpropensity'."
              )

          rewrote_path = False
          for i in range(index[0] + 1, len(lines)):
              if lines[i].startswith("  - name: "):
                  break
              if lines[i].startswith("    path: "):
                  lines[i] = f"    path: {os.environ['GITHUB_WORKSPACE']}"
                  path.write_text("\n".join(lines) + "\n")
                  rewrote_path = True
                  break
          if not rewrote_path:
              raise SystemExit(
                  "repos.yml entry 'hvtiRpropensity' does not contain a path field."
              )
          PY

      - name: Verify the house style artifact is current
        run: |
          Rscript .house-style-tools/compose-house-style.R \
            --check --repo hvtiRpropensity
